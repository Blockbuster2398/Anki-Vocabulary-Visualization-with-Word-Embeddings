<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <title>Flexbox & Grid</title>
        <link rel="stylesheet" href="style.css">
        <script src="//cdn.jsdelivr.net/npm/force-graph"></script>
        <script src="//cdn.jsdelivr.net/npm/3d-force-graph"></script>

        <!--Imports the libraries that we will use later on in our code. All of the scripts in head run immediately-->

    </head>
    

    <!--The body class contains the bulk of the page's content, and we decided to create a container class
        that we can style later in css. Within the container is a header section, an aside, and another div that contains our graph-->
    <body>
        
        <div class="container">
            <header>
                <h1>Anki Vocab Visualizer</h1>

            </header>

            <main>
                <aside id = "sidePanel">
                    <h2>Status Panel</h2>
                    <p id="statusMessage">Idle...</p>
                    <p id="totalEmbeddedNotes">Total Embedded Notes:</p>
                    <h3>Choose a deck to Display:</h3>
                    <input id="deckChoice" type="text">
                    <h3>Choose a field for card embedding:</h3>
                    <input id="fieldChoice" type="text">
                    <h3>Alternate Collection File:</h3>
                    <input id="alternateCollectionChoice" type="file">
                    <h3>Create Graph</h3>
                    <button id="CreateGraphButton">Compute Graph</button>
                    <button id="PauseNoteAdditionButton" type="button" disabled>Pause note addition</button>
                    <button id="PauseAnimationButton" type="button" disabled>Pause animation</button>
                    <label for="ColorModeChoice">Node coloring</label>
                    <select id="ColorModeChoice">
                        <option value="bands">Interval bands</option>
                        <option value="gradient">Red-green gradient</option>
                    </select>
                    <label for="NoteOrderChoice">Note order</label>
                    <select id="NoteOrderChoice">
                        <option value="random">Random order</option>
                        <option value="deck">Deck order</option>
                    </select>
                    <label for="EmbeddingModelChoice">Embedding model</label>
                    <select id="EmbeddingModelChoice">
                        <option value="Xenova/paraphrase-multilingual-MiniLM-L12-v2">Multilingual MiniLM L12</option>
                        <option value="Xenova/multilingual-e5-small">Multilingual E5 small</option>
                    </select>
                    <label for="ProjectionChoice">Random projection</label>
                    <select id="ProjectionChoice">
                        <option value="0">None (384 dimensions)</option>
                        <option value="128">128 dimensions</option>
                        <option value="64">64 dimensions</option>
                    </select>
                    <script type="module" src="/main.js"></script>
                    <!--
                    <script type="module" src="/getEmbedding.ts"></script>
                    <script type="module" src="parseCollection.js"></script>
                    -->
                </aside>
                
                <div 
                id="graph">
                </div>
            </main>
        </div>
